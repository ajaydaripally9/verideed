# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/verideed
spring.datasource.username=verideed_user
spring.datasource.password=verideed_secure_pass123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Configure multipart upload limits for deeds
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Service links (will be overridden by env variables in docker-compose)
ai.service.url=http://localhost:8000

# Server configuration
server.port=8085
