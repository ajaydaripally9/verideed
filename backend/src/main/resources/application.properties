# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:verideed}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:verideed_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:verideed_secure_pass123}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Configure multipart upload limits for deeds
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Service links (will be overridden by env variables in docker-compose)
ai.service.url=http://localhost:8000

# Server configuration
server.port=${SERVER_PORT:8080}

# Frontend redirection for error pages / client fallback
frontend.url=${FRONTEND_URL:http://localhost:5173}

